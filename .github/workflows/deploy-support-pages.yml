# Chit Chat Social — builds _site: hub root + /support/ + /ai-company/.
# Pages → Source: GitHub Actions. Copy deploy-support/CNAME to site root. Also add SAME hostnames under Pages Custom domain (DNS alone → GitHub 404).
# Remove stale domains (e.g. investli.org) — they can redirect github.io URLs to broken hosts.
# App Store URLs: Marketing https://www.chitchatsocials.com/  Support https://www.chitchatsocials.com/support/

name: Deploy support site

on:
  push:
    branches: [main]
    paths:
      - 'deploy-support/**'
      - 'docs/ai-company/**'
      - 'docs/support/**'
      - '.github/workflows/deploy-support-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-support-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Pages site (_site)
        run: |
          set -e
          mkdir -p _site/support
          cp deploy-support/github-pages-root.html _site/index.html
          cp -r docs/ai-company _site/ai-company
          cp deploy-support/index.html _site/support/index.html
          touch _site/.nojekyll
          if [ -f deploy-support/CNAME ]; then cp deploy-support/CNAME _site/CNAME; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
