# Chit Chat Social — builds a full Pages tree: docs root redirect + ai-company + /support/.
# Settings → Pages → Source: GitHub Actions. First run may need approval: Settings → Environments → github-pages.
# Support URL for App Store: https://almightybruce01.github.io/chit-chat/support/
# Root still redirects as in docs/index.html.

name: Deploy support site

on:
  push:
    branches: [main]
    paths:
      - 'deploy-support/**'
      - 'docs/index.html'
      - 'docs/ai-company/**'
      - 'docs/support/**'
      - '.github/workflows/deploy-support-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-support-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Pages site (_site)
        run: |
          set -e
          mkdir -p _site/support
          cp docs/index.html _site/
          cp -r docs/ai-company _site/ai-company
          cp deploy-support/index.html _site/support/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
